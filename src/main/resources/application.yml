spring:
  application:
    name: bookswap-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

jwt:
  access-token-expiration: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info
